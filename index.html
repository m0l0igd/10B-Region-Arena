<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10B Region Metrics | Upstream Facility Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f1f4f9;--surf:#ffffff;--s2:#eef1f7;--s3:#e1e7f0;--bdr:#d7deea;--txt:#17233a;--sub:#5b6b83;
  --neon:#14509e;--grn:#1c7d4d;--red:#b23b3b;--amb:#96690b;--pur:#6a4c93;--gold:#96690b;
  --gm:#14509e;--hv:#0f766e;--fe:#a34e0b}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;font-size:13px;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,rgba(20,80,158,.04) 0%,transparent 260px);pointer-events:none;z-index:0}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#0071ce;
  border-bottom:1px solid #005ba6;box-shadow:0 2px 8px rgba(0,45,92,.18);z-index:10;flex-shrink:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:36px;width:auto;border-radius:4px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-title{font-weight:800;font-size:1rem;letter-spacing:.01em;color:#ffffff}
.brand-sub{font-size:.6rem;color:rgba(255,255,255,.75);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:2px 9px;font-size:.58rem;color:#c8ffe0;letter-spacing:.08em;font-weight:700}
.live-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:blink 1.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.topbar-meta{font-size:.64rem;color:rgba(255,255,255,.8);line-height:1.7}
.topbar-meta-wrap{display:flex;flex-direction:column}
.topbar-meta b{color:#ffd873;font-weight:700}
.period-bar{display:flex;gap:0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:8px;overflow:hidden;margin-left:auto}
.pb{background:none;border:none;border-right:1px solid rgba(255,255,255,.2);padding:5px 13px;font-size:.62rem;font-weight:600;color:rgba(255,255,255,.75);cursor:pointer;letter-spacing:.06em;transition:all .2s;white-space:nowrap}
.pb:last-child{border-right:none}.pb:hover{color:#fff;background:rgba(255,255,255,.14)}
.pb.on{background:#fff;color:#0071ce}
#clock{font-size:.62rem;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── KPI STRIP ── */
.kpi-strip{display:flex;overflow-x:auto;touch-action:pan-x;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;scrollbar-width:none}
.kpi-strip::-webkit-scrollbar{display:none}
.kstat{flex:1;min-width:105px;padding:8px 12px;border-right:1px solid var(--bdr);text-align:center;position:relative}
.kstat:last-child{border:none}
.kstat-l{font-size:.62rem;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kstat-v{font-size:1.2rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.kstat-u{font-size:.6rem;color:var(--sub);font-weight:600;margin-top:1px}
.kstat-bar{position:absolute;bottom:0;left:0;height:2px;width:0;transition:width 1.4s cubic-bezier(.16,1,.3,1)}

/* ── BODY (left + right) ── */
.body{display:flex;flex:1;overflow:hidden;position:relative;z-index:1}

/* ── LEFT PANEL ── */
.left{width:280px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--bdr);background:var(--surf);transition:width .3s cubic-bezier(.4,0,.2,1);overflow:hidden;position:relative}
.left.collapsed{width:0;border-right:none}
.left-inner{min-width:280px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0}

/* ── Collapse button — always fixed to viewport ── */
.collapse-btn{
  position:fixed;top:50vh;left:0;transform:translateY(-50%);
  z-index:9999;width:28px;height:48px;
  background:var(--s2);border:1px solid var(--bdr);border-left:none;
  border-radius:0 10px 10px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--neon);font-size:.9rem;
  transition:left .3s cubic-bezier(.4,0,.2,1);
  box-shadow:2px 0 10px rgba(23,35,58,.1)}
.collapse-btn:hover{background:var(--s3);border-color:var(--neon)}
.collapse-btn.open{left:280px}

/* ══ MOBILE DRAWER ══════════════════════════════════════════
   On mobile the left panel is a fixed-position drawer.
   The right panel scrolls independently.
   The FAB button is fixed bottom-right, always visible.
═══════════════════════════════════════════════ */
@media(max-width:768px),(pointer:coarse) and (max-width:1024px){
  /* Left panel becomes a fixed drawer, slides in from left */
  .left{
    position:fixed!important;
    top:0;left:0;height:100%!important;
    width:82vw!important;max-width:320px!important;
    transform:translateX(-105%);
    transition:transform .28s cubic-bezier(.4,0,.2,1)!important;
    z-index:800;overflow-y:auto!important;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
    border-right:1px solid var(--bdr)!important}
  .left.open{transform:translateX(0)!important}
  /* width collapse trick no longer needed on mobile */
  .left.collapsed{width:82vw!important;transform:translateX(-105%)!important}
  .left-inner{min-width:unset!important}
  /* Right panel scrolls on its own */
  .right{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain;touch-action:pan-y!important}
  .spotlight{height:auto!important;overflow:visible!important;padding:12px!important;flex:none!important}
  .sp-content{overflow:visible!important;height:auto!important;flex:none!important}
  .tab-pane.on{display:block!important;height:auto!important;overflow:visible!important}
  /* FAB toggle — bright, fixed, bottom-right, impossible to miss */
  .collapse-btn{
    position:fixed!important;
    bottom:22px!important;right:22px!important;
    left:auto!important;top:auto!important;
    transform:none!important;
    width:54px!important;height:54px!important;
    border-radius:50%!important;
    background:var(--neon)!important;
    color:#fff!important;
    font-size:1.3rem!important;
    border:none!important;
    box-shadow:0 0 0 4px rgba(20,80,158,.18),0 6px 18px rgba(23,35,58,.25)!important;
    z-index:900!important}
  /* Layout tweaks */
  .sp-metrics{grid-template-columns:repeat(2,1fr)!important}
  .det-grid{grid-template-columns:1fr 1fr!important}
  .radar-wrap{height:250px!important}
  .trade-bar{grid-template-columns:repeat(2,1fr)!important}
  .topbar{flex-wrap:wrap;max-height:320px;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .32s ease}
  .kpi-strip{overflow-x:auto;overflow-y:hidden;max-height:160px;transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .32s ease}
  body.hdr-collapsed .topbar{max-height:0!important;padding-top:0!important;padding-bottom:0!important;opacity:0;pointer-events:none}
  body.hdr-collapsed .kpi-strip{max-height:0!important;padding-top:0!important;padding-bottom:0!important;opacity:0;pointer-events:none}
  /* Tap anywhere outside the open drawer to close it -- much easier than hunting for the FAB */
  .drawer-backdrop.on{opacity:1;pointer-events:auto}
}
/* Dimmed overlay behind the open mobile drawer. Hidden/non-interactive until
   .on is added by toggleSidebar(); only ever shown within the mobile media
   query above since desktop has no drawer to dim behind. */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:750;opacity:0;pointer-events:none;transition:opacity .25s ease}
.left-ctrl{padding:10px 12px;border-bottom:1px solid var(--bdr);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.srch{background:var(--s2);border:1px solid var(--bdr);border-radius:20px;padding:6px 12px;color:var(--txt);font-size:.75rem;outline:none;width:100%;transition:border-color .2s}
.srch:focus{border-color:var(--neon)}
.role-tabs{display:flex;gap:4px}
.rtab{flex:1;background:var(--s2);border:1px solid var(--bdr);border-radius:7px;padding:4px 2px;font-size:.58rem;font-weight:600;color:var(--sub);cursor:pointer;text-align:center;transition:all .2s;white-space:nowrap}
.rtab:hover{border-color:var(--neon);color:var(--neon)}
.rtab.on{background:var(--neon);border-color:var(--neon);color:#fff}
.lb-list{overflow-y:auto;flex:1;padding:6px;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.lb-section-hdr{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:700;padding:8px 6px 4px;display:flex;align-items:center;gap:6px;border-top:1px solid var(--bdr);margin-top:4px}
.lb-section-hdr:first-child{border-top:none;margin-top:0}
.lb-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:all .2s;position:relative;margin-bottom:2px}
.lb-row:hover{background:var(--s2)}.lb-row.active{background:var(--s3);border:1px solid rgba(20,80,158,.3)}
.lb-rank{width:24px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:800;flex-shrink:0}
.rk1{background:rgba(150,105,11,.14);color:var(--gold);border:1px solid rgba(150,105,11,.35)}
.rk2{background:rgba(107,114,128,.12);color:#4b5563;border:1px solid rgba(107,114,128,.3)}
.rk3{background:rgba(139,90,43,.12);color:#8b5a2b;border:1px solid rgba(139,90,43,.3)}
.rkn{background:var(--s2);color:var(--sub);border:1px solid var(--bdr);font-size:.6rem}
.lb-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem;color:#fff;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:600;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-meta{font-size:.68rem;color:var(--sub);font-weight:600}
.lb-dots{display:flex;gap:3px;flex-wrap:nowrap}
.ld{width:5px;height:5px;border-radius:2px;flex-shrink:0}
.lb-score{font-size:.65rem;font-weight:800;color:var(--sub);white-space:nowrap}
.rk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--sub)}
.rk-delta{font-size:.72rem;font-weight:800;white-space:nowrap}
.rk-delta-up{color:var(--grn)}
.rk-delta-down{color:var(--red)}
.rk-delta-none{color:var(--sub);font-weight:600}

/* ── RIGHT PANEL – Spotlight ── */
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.spotlight{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:16px 20px 0}

/* hero top */
.sp-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-shrink:0}
.sp-av{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;color:#fff;position:relative;flex-shrink:0}
.sp-av-ring{position:absolute;inset:-3px;border-radius:17px;border:2px solid;opacity:.5}
.sp-name{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.sp-role{font-size:.65rem;color:var(--sub);margin-top:3px}
.sp-badge{font-size:1.1rem;font-weight:800;color:var(--gold);margin-left:auto}
.sp-allok{font-size:.62rem;color:var(--grn);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}

/* metric tiles */
.sp-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;flex-shrink:0}
.sm{background:var(--surf);border-radius:12px;padding:12px 14px;border:1px solid var(--bdr);position:relative;overflow:hidden;transition:border-color .25s;box-shadow:0 1px 3px rgba(23,35,58,.05)}
.sm:hover{border-color:rgba(20,80,158,.3)}
.sm-label{font-size:.55rem;text-transform:uppercase;letter-spacing:.09em;color:var(--sub);font-weight:700;margin-bottom:6px}
.sm-value{font-size:1.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.sm-goal{font-size:.54rem;color:var(--sub);margin-top:4px}
.sm-bar{height:3px;border-radius:2px;margin-top:8px;width:0;transition:width 1.1s cubic-bezier(.16,1,.3,1)}
.sm-glow{position:absolute;inset:0;border-radius:12px;opacity:.04;pointer-events:none}

/* tabs */
.sp-tabs{display:flex;gap:0;background:var(--s2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:12px;flex-shrink:0}
.sptab{flex:1;background:none;border:none;border-right:1px solid var(--bdr);padding:8px 10px;font-size:.68rem;font-weight:600;color:var(--sub);cursor:pointer;transition:all .2s;letter-spacing:.03em}
.sptab:last-child{border:none}.sptab:hover{color:var(--neon);background:rgba(20,80,158,.06)}
.sptab.on{color:#fff;background:var(--neon)}

/* tab content */
.sp-content{flex:1;overflow:hidden;position:relative}
.tab-pane{display:none;height:100%;overflow-y:auto;padding-bottom:12px}
.tab-pane.on{display:block}

/* detail grid */
.det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dc{background:var(--surf);border-radius:10px;padding:10px 12px;border:1px solid var(--bdr)}
.dl{font-size:.55rem;text-transform:uppercase;color:var(--sub);font-weight:700;letter-spacing:.06em;margin-bottom:4px}
.dv{font-size:1rem;font-weight:800}.dg{font-size:.57rem;color:var(--sub);margin-top:2px}.ds{font-size:.55rem;color:var(--sub);margin-top:2px}
.dv.ok{color:var(--grn)}.dv.bad{color:var(--red)}
.radar-wrap{background:var(--surf);border-radius:12px;padding:14px;height:220px;border:1px solid var(--bdr)}

/* Focus items */
.fi{border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid}
.fi.crit{background:rgba(178,59,59,.05);border-color:rgba(178,59,59,.22)}
.fi.warn{background:rgba(150,105,11,.05);border-color:rgba(150,105,11,.2)}
.fi.good{background:rgba(28,125,77,.05);border-color:rgba(28,125,77,.18)}
.fi-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fi-badge{margin-left:auto;font-size:.55rem;padding:2px 8px;border-radius:6px;font-weight:700}
.fi-badge.crit{background:rgba(178,59,59,.15);color:var(--red)}.fi-badge.warn{background:rgba(150,105,11,.14);color:var(--amb)}.fi-badge.good{background:rgba(28,125,77,.12);color:var(--grn)}
.fi-vals{display:flex;gap:14px;margin-bottom:6px;font-size:.63rem}
.fi-vl{font-size:.5rem;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.fi-vv{font-weight:700}
.fi-tips{font-size:.63rem;color:var(--sub);line-height:1.8;border-top:1px solid var(--bdr);padding-top:7px}
.fi-tips li{margin-left:14px}
.fi-bar{background:var(--s2);border-radius:2px;height:3px;margin-top:8px;overflow:hidden}
.fi-bar-f{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.16,1,.3,1)}

/* trade avg row */
.lb-trade-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:2px;border:1px solid var(--bdr);background:var(--s2)}
.lb-trade-row:hover{background:var(--s3);border-color:rgba(20,80,158,.25)}
.lb-trade-row.active{background:var(--s3);border-color:var(--neon)}
.lb-trade-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;border:1px solid var(--bdr)}
.trade-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 20px;background:var(--surf);border-top:1px solid var(--bdr);flex-shrink:0}
.tb-stat{background:var(--s2);border-radius:8px;padding:7px 10px;border:1px solid var(--bdr);text-align:center}
.tb-l{font-size:.5rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700}
.tb-v{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tb-g{font-size:.5rem;color:var(--sub);margin-top:1px}

/* placeholder */
.no-select{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--sub);gap:6px}
.no-select-bar{width:44px;height:3px;border-radius:2px;background:var(--neon);opacity:.4;margin-bottom:8px}

@media(max-width:700px){.left{width:220px}.sp-metrics{grid-template-columns:repeat(3,1fr)}.det-grid{grid-template-columns:1fr 1fr}}
</style></head>

(function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});setTimeout(tick,1000);})();

// ── Animated counter ─────────────────────────────────────────
function ac(el,v,fl,su,dur=1100){if(!el)return;const s=performance.now();(function f(n){const p=Math.min((n-s)/dur,1),e=1-Math.pow(1-p,3);el.textContent=(fl?(v*e).toFixed(2):Math.round(v*e))+su;if(p<1)requestAnimationFrame(f);})(performance.now());}

// ── Period selection — real BigQuery-sourced data per window, no fake math ──
function techs(){return D.periods[curDays]||D.periods[30]||[];}

// ── KPI Strip ─────────────────────────────────────────────────
function buildKPI(){
  // Blended KPI strip only counts tech-level rows (GM/HVACR/FE) -- FSM/RGM
  // rows are rollups of the SAME underlying work orders re-aggregated by
  // manager, so blending them in here would double-count everything.
  const ts=techs().filter(t=>['GM','HVACR','FE'].includes(t.role)),G=D.goals,t1=ts.filter(t=>t.wos_1p>0);
  const ad=t1.reduce((s,t)=>s+t.dtc*t.wos_1p,0)/t1.reduce((s,t)=>s+t.wos_1p,0);
  const ar=t1.reduce((s,t)=>s+(t.response||0)*t.wos_1p,0)/t1.reduce((s,t)=>s+t.wos_1p,0);
  const as=t1.reduce((s,t)=>s+(t.self_perf||0)*t.wos_1p,0)/t1.reduce((s,t)=>s+t.wos_1p,0);
  const af=t1.reduce((s,t)=>s+(t.ftf||0)*t.wos_1p,0)/t1.reduce((s,t)=>s+t.wos_1p,0);
  const hpT=t1.filter(t=>t.dtc_hp!=null&&t.hp_wos>0);
  const ah=hpT.length?hpT.reduce((s,t)=>s+t.dtc_hp*t.hp_wos,0)/hpT.reduce((s,t)=>s+t.hp_wos,0):null;
  const tot1p=ts.reduce((s,t)=>s+t.wos_1p,0);
  const ks=[
    {l:'TEAM DTC',v:ad,g:G.dtc,lo:true,fl:true,su:'d',col:isOk(ad,G.dtc,true)?'var(--grn)':'var(--amb)'},
    {l:'TEAM DTC HP',v:ah,g:G.dtc_hp,lo:true,fl:true,su:'d',col:ah!=null?(isOk(ah,G.dtc_hp,true)?'var(--grn)':'var(--amb)'):'var(--sub)'},
    {l:'RESPONSE',v:ar,g:G.response,lo:false,fl:true,su:'%',col:isOk(ar,G.response,false)?'var(--grn)':'var(--amb)'},
    {l:'SELF PERF',v:as,g:G.self_perf,lo:false,fl:true,su:'%',col:isOk(as,G.self_perf,false)?'var(--grn)':'var(--amb)'},
    {l:'FIRST-TIME FIX',v:af,g:G.ftf,lo:false,fl:true,su:'%',col:isOk(af,G.ftf,false)?'var(--grn)':'var(--amb)'},
    {l:'1P WORK ORDERS',v:tot1p,g:null,fl:false,su:'',col:'var(--neon)'},
    {l:'TECHNICIANS',v:D.meta.n_techs,g:null,fl:false,su:'',col:'var(--neon)'},
    {l:'FS MANAGERS',v:D.meta.n_fsm,g:null,fl:false,su:'',col:'var(--gold)'},
    {l:'REGIONAL MGRS',v:D.meta.n_rgm,g:null,fl:false,su:'',col:'var(--pur)'},
  ];
  document.getElementById('kpi-strip').innerHTML=ks.map((k,i)=>`<div class="kstat">
    <div class="kstat-l">${k.l}</div>
    <div class="kstat-v" style="color:${k.col}" id="ks${i}">${k.v==null?'—':'0'+(k.su)}</div>
    <div class="kstat-u">${k.g!=null?(k.lo?'Goal ≤':'Goal ≥')+k.g+k.su:''}&nbsp;</div>
    <div class="kstat-bar" id="kb${i}" style="background:${k.col}"></div>
  </div>`).join('');
  document.getElementById('mgr').textContent=D.meta.manager;
  document.getElementById('period-lbl').textContent=curPeriodMeta().period||'';
  setTimeout(()=>ks.forEach((k,i)=>{
    if(k.v!=null)ac(document.getElementById('ks'+i),k.v,k.fl,k.su);
    const kb=document.getElementById('kb'+i);
    const w=k.v==null?0:k.g!=null?Math.min(Math.abs(k.v)/(k.lo?k.g*2:100)*100,100):100;
    setTimeout(()=>{if(kb)kb.style.width=w+'%';},200+i*60);
  }),100);
}

    const totalWos=grp.reduce((s,t)=>s+t.wos,0);

    const avgSp=grp.reduce((s,t)=>s+(t.self_perf||0)*t.wos_1p,0)/w1p;
    const avgFtf=grp.reduce((s,t)=>s+(t.ftf||0)*t.wos_1p,0)/w1p;
    const metOk=[isOk(avgDtc,G.dtc,true),isOk(avgRes,G.response,false),isOk(avgSp,G.self_perf,false),isOk(avgFtf,G.ftf,false)];
    const tradeDots=metOk.map((ok,i)=>`<div class="ld" style="background:${ok?'var(--grn)':'var(--red)'}"></div>`).join('');
    const tradeActive=selTradeAvg===role&&selTech===null;
    html+=`<div class="lb-section-hdr" data-role="${role}">${role} <span style="color:var(--neon);font-weight:700;font-size:.64rem;margin-left:auto">${totalWos} WOs</span></div>`;
    // ── Trade average row ──────────────────────────────────────
    html+=`<div class="lb-trade-row ${tradeActive?'active':''}" data-role="${role}" onclick="selectTradeAvg('${role}')">
      <div class="lb-trade-ico" style="background:${RC[role]}22;border-color:${RC[role]}44;color:${RC[role]}">Σ</div>
      <div class="lb-info">
        <div class="lb-name" style="color:${RC[role]}">${RANK_LABEL[role]}</div>
        <div class="lb-meta">${grp.length} techs · ${totalWos} WOs combined</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div class="lb-dots">${tradeDots}</div>
        <div class="lb-score" style="color:${metOk.every(Boolean)?'var(--grn)':'var(--sub)'};font-size:.55rem">${metOk.filter(Boolean).length}/4 goals</div>
      </div>
    </div>`;
    grp.forEach(t=>{
      const r=t.rank_overall,cls=r===1?'rk1':r===2?'rk2':r===3?'rk3':'rkn';
      const med='#'+r;
      const allOk=[isOk(t.dtc,D.goals.dtc,true),isOk(t.response,D.goals.response,false),isOk(t.self_perf,D.goals.self_perf,false),isOk(t.ftf,D.goals.ftf,false)].every(Boolean);
      // 4 dots = 4 key metrics
      const dots=['dtc','response','self_perf','ftf'].map((k,i)=>{
        const ok=i===0?isOk(t[k],D.goals[k],true):isOk(t[k],D.goals[k],false);
        return`<div class="ld" style="background:${ok?'var(--grn)':'var(--red)'}" title="${k}"></div>`;
      }).join('');
      html+=`<div class="lb-row ${selTech===t.name?'active':''}" data-name="${t.name.toLowerCase()}" data-role="${role}" onclick="selectTech('${t.name}')">
        <div class="lb-rank ${cls}">${med}</div>
        <div class="lb-av" style="background:${RC[role]}">${t.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div class="lb-info">
          <div class="lb-name">${t.name}</div>
          <div class="lb-meta">${t.wos_1p} WOs · ${t.stores} stores</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div class="lb-dots">${dots}</div>
          <div class="lb-score" style="color:${allOk?'var(--grn)':'var(--sub)'}">${t.score}pts</div>
        </div>
      </div>`;
    });
  });
  document.getElementById('lb-list').innerHTML=html||'<div style="padding:16px;text-align:center;color:var(--sub);font-size:.72rem">No techs match</div>';
}

// ── Select trade average ─────────────────────────────────────
function selectTradeAvg(role){
  selTech=null;selTradeAvg=role;
  buildLB();
  const ts=techs(),grp=ts.filter(t=>t.role===role),G=D.goals;
  const col=RC[role];
  const w1p=grp.reduce((s,t)=>s+t.wos_1p,0)||1;
  const avgDtc=grp.reduce((s,t)=>s+t.dtc*t.wos_1p,0)/w1p;
  const avgRes=grp.reduce((s,t)=>s+(t.response||0)*t.wos_1p,0)/w1p;
  const avgSp=grp.reduce((s,t)=>s+(t.self_perf||0)*t.wos_1p,0)/w1p;
  const avgFtf=grp.reduce((s,t)=>s+(t.ftf||0)*t.wos_1p,0)/w1p;
  const hpG=grp.filter(t=>t.dtc_hp!=null&&t.hp_wos>0);
  const avgHp=hpG.length?hpG.reduce((s,t)=>s+t.dtc_hp*t.hp_wos,0)/hpG.reduce((s,t)=>s+t.hp_wos,0):null;
  const totWos=grp.reduce((s,t)=>s+t.wos,0);
  const tot1p=grp.reduce((s,t)=>s+t.wos_1p,0);
  const tot3p=grp.reduce((s,t)=>s+t.wos_3p,0);
  const totSlaU=grp.reduce((s,t)=>s+t.sla_under,0);
  const totSlaO=grp.reduce((s,t)=>s+t.sla_over,0);
  const totSlaM=grp.reduce((s,t)=>s+t.sla_missing,0);
  const totRecalls=grp.reduce((s,t)=>s+t.recalls,0);
  const metOk=[isOk(avgDtc,G.dtc,true),isOk(avgRes,G.response,false),isOk(avgSp,G.self_perf,false),isOk(avgFtf,G.ftf,false)];
  const allOk=metOk.every(Boolean);
  const mtile=(id,lbl,v,g,lo,su,icon)=>{
    const val=su==='d'?f2(v)+'d':pct(v);
    const ok=isOk(v,g,lo);
    const bw=v==null?0:Math.min(Math.abs(v)/(lo?g*2:100)*100,100);
    return`<div class="sm"><div class="sm-glow" style="background:${gc(ok)}"></div>
      <div class="sm-label">${lbl}</div>
      <div class="sm-value" style="color:${gc(ok)}" id="spv-${id}">–</div>
      <div class="sm-goal">${ok?'✓ on goal':'✗ off goal'} · ${lo?'≤':'≥'}${g}${su} · ${grp.length} techs</div>
      <div class="sm-bar" data-w="${bw.toFixed(1)}" style="background:${gc(ok)}"></div>
    </div>`;
  };
  const detRows=grp.sort((a,b)=>a.rank_overall-b.rank_overall).map(t=>{
    const allT=[isOk(t.dtc,G.dtc,true),isOk(t.response,G.response,false),isOk(t.self_perf,G.self_perf,false),isOk(t.ftf,G.ftf,false)].every(Boolean);
    const med='#'+t.rank_overall;
    return`<tr onclick="selectTech('${t.name}')" style="cursor:pointer" title="Click to view ${t.name}">
      <td>${med}</td>
      <td style="font-weight:700;color:${col}">${t.name}</td>
      <td style="color:${isOk(t.dtc,G.dtc,true)?'var(--grn)':'var(--red)'}">${f2(t.dtc)}d</td>
      <td style="color:${isOk(t.dtc_hp,G.dtc_hp,true)?'var(--grn)':'var(--sub)'}">${t.dtc_hp!=null?f2(t.dtc_hp)+'d':'—'}</td>
      <td style="color:${isOk(t.response,G.response,false)?'var(--grn)':'var(--red)'}">${pct(t.response)}</td>
      <td style="color:${isOk(t.self_perf,G.self_perf,false)?'var(--grn)':'var(--red)'}">${pct(t.self_perf)}</td>
      <td style="color:${isOk(t.ftf,G.ftf,false)?'var(--grn)':'var(--red)'}">${pct(t.ftf)}</td>
      <td style="color:var(--gold);font-weight:800">${t.score}pts</td>
      <td class="rk-circle-cell"><span class="rk-dot" style="background:${allT?'var(--grn)':'transparent'};border-color:${allT?'var(--grn)':'var(--sub)'}"></span></td>
      <td>${fmtDelta(t.rank_delta)}</td>
    </tr>`;
  }).join('');
  const html=`
    <div class="sp-hero">
      <div class="sp-av" style="background:${col};font-size:1.4rem">
        <div class="sp-av-ring" style="border-color:${allOk?'rgba(28,125,77,.6)':col+'55'}"></div>
        ${RI[role]}
      </div>
      <div>
        <div class="sp-name">${RANK_LABEL[role]}</div>
        <div class="sp-role">${grp.length} entries · ${totWos} total WOs · ${tot1p} 1P + ${tot3p} 3P</div>
        ${allOk?'<div class="sp-allok">All trade goals met</div>':''}
      </div>
      <div class="sp-badge">${metOk.filter(Boolean).length}/4</div>
    </div>
    <div class="sp-metrics">
      ${mtile('dtc','Avg DTC',avgDtc,G.dtc,true,'d','⏱')}
      ${mtile('res','Avg Response',avgRes,G.response,false,'%','')}
      ${mtile('sp','Avg Self Perf',avgSp,G.self_perf,false,'%','')}
      ${mtile('ftf','Avg FTF',avgFtf,G.ftf,false,'%','')}
      ${avgHp!=null?mtile('hp','Avg DTC HP',avgHp,G.dtc_hp,true,'d','')
        :`<div class="sm" style="opacity:.35"><div class="sm-label">Avg DTC HP</div><div class="sm-value" style="color:var(--sub)">N/A</div><div class="sm-goal">No HP WOs</div><div class="sm-bar"></div></div>`}
    </div>
    <div class="sp-content">
      <div class="tab-pane on" id="tab-det">
        <div class="det-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
          <div class="dc"><div class="dl">Total WOs</div><div class="dv" style="color:var(--neon)">${totWos}</div><div class="dg">${tot1p} 1P · ${tot3p} 3P</div></div>
          <div class="dc"><div class="dl">SLA Compliance</div><div class="dv ok">${totSlaU}</div><div class="dg">${totSlaU} Under · ${totSlaO} Over</div><div class="ds">${totSlaM} Missing</div></div>
          <div class="dc"><div class="dl">Total Recalls</div><div class="dv ${totRecalls>0?'bad':'ok'}">${totRecalls}</div><div class="dg">Across all ${grp.length} techs</div></div>
          <div class="dc"><div class="dl">Goals Met</div><div class="dv" style="color:var(--gold)">${metOk.filter(Boolean).length}/4</div><div class="dg">${allOk?'All on target':'Some off target'}</div></div>
        </div>
        <div style="overflow-x:auto">
          <table class="wo-tbl"><thead><tr>
            <th>Rank</th><th>Name</th><th onclick="">DTC ↓</th><th>DTC HP ↓</th><th>Response ↑</th><th>Self Perf ↑</th><th>FTF ↑</th><th>Score</th><th>Goals</th><th>Trend</th>
          </tr></thead><tbody>${detRows}</tbody></table>
        </div>
      </div>
    </div>`;
  document.getElementById('spotlight').innerHTML=html;
  setTimeout(()=>{
    const vals={dtc:avgDtc,res:avgRes,sp:avgSp,ftf:avgFtf,hp:avgHp};
    const suf={dtc:'d',res:'%',sp:'%',ftf:'%',hp:'d'};
    Object.keys(vals).forEach(k=>{const el=document.getElementById('spv-'+k);if(el&&vals[k]!=null)ac(el,vals[k],true,suf[k]);});
    document.querySelectorAll('#spotlight .sm-bar').forEach(b=>{const w=b.dataset.w||0;b.style.width='0';setTimeout(()=>b.style.width=w+'%',100);});
  },80);
  buildTradeSummary(role);
  closeDrawerOnMobile(); // let the user actually see/scroll the group ranking table underneath
}

// ── Trade Summary Bar ─────────────────────────────────────────
function buildTradeSummary(role){
  const ts=techs(),grp=ts.filter(t=>t.role===role),G=D.goals;
  const w1p=grp.reduce((s,t)=>s+t.wos_1p,0)||1;
  const ad=grp.reduce((s,t)=>s+t.dtc*t.wos_1p,0)/w1p;
  const ar=grp.reduce((s,t)=>s+(t.response||0)*t.wos_1p,0)/w1p;
  const as=grp.reduce((s,t)=>s+(t.self_perf||0)*t.wos_1p,0)/w1p;
  const af=grp.reduce((s,t)=>s+(t.ftf||0)*t.wos_1p,0)/w1p;
  const hpG=grp.filter(t=>t.dtc_hp!=null&&t.hp_wos>0);
  const ah=hpG.length?hpG.reduce((s,t)=>s+t.dtc_hp*t.hp_wos,0)/hpG.reduce((s,t)=>s+t.hp_wos,0):null;
  const bar=document.getElementById('trade-bar');
  bar.style.display='grid';
  const stat=(l,v,ok,su)=>`<div class="tb-stat"><div class="tb-l">${l}</div><div class="tb-v" style="color:${ok?'var(--grn)':'var(--amb)'}">${v}</div><div class="tb-g">${role} avg</div></div>`;
  bar.innerHTML=`
    <div class="tb-stat" style="border-color:${RC[role]}"><div class="tb-l">TRADE</div><div class="tb-v" style="color:${RC[role]};font-size:.85rem">${RL[role].split(' ')[0]}</div><div class="tb-g">${grp.length} techs · ${grp.reduce((s,t)=>s+t.wos,0)} WOs</div></div>
    ${stat('AVG DTC',f2(ad)+'d',isOk(ad,G.dtc,true),'d')}
    ${ah!=null?stat('AVG DTC HP',f2(ah)+'d',isOk(ah,G.dtc_hp,true),'d'):'<div class="tb-stat" style="opacity:.35"><div class="tb-l">AVG DTC HP</div><div class="tb-v" style="color:var(--sub)">N/A</div><div class="tb-g">No HP WOs</div></div>'}
    ${stat('AVG RESPONSE',pct(ar),isOk(ar,G.response,false),'%')}
    ${stat('AVG FTF',pct(af),isOk(af,G.ftf,false),'%')}`;
}

      </div>
      <div class="sp-badge">${med}</div>
    </div>
    <div class="sp-metrics">
      ${mtile('dtc','Avg DTC',t.dtc,G.dtc,true,'d','⏱',t.rank_dtc)}
      ${mtile('res','Response',t.response,G.response,false,'%','',t.rank_response)}
      ${mtile('sp','Self Perf',t.self_perf,G.self_perf,false,'%','',t.rank_self_perf)}
      ${mtile('ftf','FTF',t.ftf,G.ftf,false,'%','',t.rank_ftf)}
      ${t.dtc_hp!=null?mtile('hp','DTC HP',t.dtc_hp,G.dtc_hp,true,'d','',t.rank_dtc_hp)
        :`<div class="sm" style="opacity:.35"><div class="sm-label">DTC HP</div><div class="sm-value" style="color:var(--sub)">N/A</div><div class="sm-goal">No HP work orders</div><div class="sm-bar"></div></div>`}

    <div class="sp-tabs">

      <div class="tab-pane on" id="tab-det">${buildDetails(t,grp)}</div>
      <div class="tab-pane" id="tab-radar"><div class="radar-wrap"><canvas id="rc"></canvas></div></div>
      <div class="tab-pane" id="tab-focus">${buildFocus(t,grp)}</div>

  document.getElementById('spotlight').innerHTML=html;
  // animate metric tiles
  setTimeout(()=>{
    ['dtc','res','sp','ftf','hp'].forEach(k=>{
      const el=document.getElementById('spv-'+k);
      const vals={dtc:t.dtc,res:t.response,sp:t.self_perf,ftf:t.ftf,hp:t.dtc_hp};
      const suf={dtc:'d',res:'%',sp:'%',ftf:'%',hp:'d'};
      if(!el||vals[k]==null)return;
      ac(el,vals[k],true,suf[k]);
    });
    document.querySelectorAll('#spotlight .sm-bar').forEach(b=>{const w=b.dataset.w||0;b.style.width='0';setTimeout(()=>b.style.width=w+'%',100);});
  },80);
}

function switchTab(id,btn){
  document.querySelectorAll('.sptab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('tab-'+id).classList.add('on');
  if(id==='radar')buildRadar();
}

// ── Bar Chart (replaces radar) ──────────────────────────────────────
function buildRadar(){
  if(radarChart)radarChart.destroy();
  const t=techs().find(x=>x.name===selTech);if(!t)return;
  const G=D.goals,col=RC[t.role];
  const metrics=[
    {label:'DTC',actual:t.dtc,goal:G.dtc,lo:true,max:8,su:'d'},
    {label:'Response',actual:t.response,goal:G.response,lo:false,max:100,su:'%'},
    {label:'Self Perf',actual:t.self_perf,goal:G.self_perf,lo:false,max:100,su:'%'},
    {label:'FTF',actual:t.ftf,goal:G.ftf,lo:false,max:100,su:'%'},
    ...(t.dtc_hp!=null?[{label:'DTC HP',actual:t.dtc_hp,goal:G.dtc_hp,lo:true,max:4,su:'d'}]:[]),
  ];
  const labels=metrics.map(m=>m.label);
  const actuals=metrics.map(m=>m.actual!=null?+m.actual.toFixed(2):0);
  const goals=metrics.map(m=>m.goal);
  const barColors=metrics.map(m=>isOk(m.actual,m.goal,m.lo)?'rgba(28,125,77,.85)':'rgba(178,59,59,.85)');
  const barBorders=metrics.map(m=>isOk(m.actual,m.goal,m.lo)?'rgba(28,125,77,1)':'rgba(178,59,59,1)');
  radarChart=new Chart(document.getElementById('rc'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Actual',data:actuals,backgroundColor:barColors,borderColor:barBorders,borderWidth:2,borderRadius:6,borderSkipped:false},
        {label:'Goal',data:goals,type:'line',borderColor:'rgba(150,105,11,.85)',borderWidth:2,borderDash:[6,4],pointBackgroundColor:'rgba(150,105,11,.95)',pointRadius:4,fill:false,tension:0}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:'rgba(23,35,58,.75)',font:{size:10}}},
        tooltip:{callbacks:{label:ctx=>{
          const m=metrics[ctx.dataIndex];
          const v=ctx.parsed.y;
          return ctx.dataset.label+': '+(m&&m.su?v.toFixed(2)+m.su:v);
        }}}
      },
      scales:{
        x:{grid:{color:'rgba(23,35,58,.07)'},ticks:{color:'rgba(23,35,58,.7)',font:{size:11}}},
        y:{grid:{color:'rgba(23,35,58,.07)'},ticks:{color:'rgba(23,35,58,.55)',font:{size:10}},beginAtZero:true}
      },
      animation:{duration:700,easing:'easeOutQuart'}
    }
  });
}

// ── Focus pane ────────────────────────────────────────────────
const TIPS={dtc:{icon:'',label:'Days to Complete',tips:['Close WOs same day when work is done — avoid leaving tickets open overnight','Check WOs in "In Progress" with no recent activity and close them','Pre-stage parts before arriving to reduce multi-trip completions','Review your oldest open WOs daily — aged tickets drag your average up','Coordinate with parts team to expedite orders on high-priority jobs']},
  dtc_hp:{icon:'',label:'High-Priority DTC',tips:['Pe and P1 WOs should be same-day or next-day — treat them as emergency calls','Notify your lead immediately when a Pe/P1 job cannot be done same day','Stage common emergency parts in your van (capacitors, fuses, belts)','Check open Pe/P1 tickets every morning before starting P3/P4 work','Document every check-in/out accurately so DTC calc reflects real time']},
  response:{icon:'',label:'Response Time (SLA)',tips:['Respond to new WO assignments within 2 hours during business hours','Review your SLA clock before leaving a site — do not let it go red','Update WO status in Walmtech in real time, not at end of day','Cluster store visits geographically to reduce travel time between SLAs','If you cannot respond in time, escalate to your supervisor immediately']},
  self_perf:{icon:'',label:'Self Performance',tips:['Before sending to 3P, confirm the equipment is within your certification','Review 3P WOs monthly — identify any you could handle next time','Complete training modules for equipment types currently going to 3P','Each 3P assignment costs the company ~3× what a 1P completion costs','Track which store+equipment combos go 3P and proactively get the training']},
  ftf:{icon:'',label:'First Time Fix',tips:['Cycle-test the equipment fully before closing — do not assume it is fixed','Document root cause clearly so the next tech is not starting from scratch','Order all suspected failed parts at once rather than fixing one at a time','Review your recall WOs to find patterns — same model or store?','Ask the department manager to test the unit before you leave the building']}};
function buildFocus(t,grp){
  const G=D.goals;
  const checks=[
    {key:'dtc',    val:t.dtc,       goal:G.dtc,      lo:true,  su:'d',  fmt:v=>v==null?'—':v.toFixed(2)+'d'},
    {key:'dtc_hp', val:t.dtc_hp,    goal:G.dtc_hp,   lo:true,  su:'d',  fmt:v=>v==null?'N/A':v.toFixed(2)+'d'},
    {key:'response',val:t.response, goal:G.response, lo:false, su:'%',  fmt:v=>v==null?'—':v.toFixed(1)+'%'},
    {key:'self_perf',val:t.self_perf,goal:G.self_perf,lo:false,su:'%',  fmt:v=>v==null?'—':v.toFixed(1)+'%'},
    {key:'ftf',    val:t.ftf,       goal:G.ftf,      lo:false, su:'%',  fmt:v=>v==null?'—':v.toFixed(1)+'%'},
  ];
  checks.forEach(c=>{c.ok=c.val==null?true:isOk(c.val,c.goal,c.lo);c.gap=c.val==null?0:(c.lo?Math.max(0,c.val-c.goal):Math.max(0,c.goal-c.val));const p=c.su==='d'?c.gap/c.goal*100:c.gap;c.sev=c.ok?'good':p>15?'crit':'warn';});
    checks.sort((a,b)=>({crit:0,warn:1,good:2}[a.sev]-{crit:0,warn:1,good:2}[b.sev]||b.gap-a.gap));
  return checks.map((c,i)=>{
    const tip=TIPS[c.key];if(!tip)return'';
    const barW=c.val==null?0:Math.min(Math.abs(c.val)/(c.lo?c.goal*2:100)*100,100).toFixed(1);
    const barCol=c.ok?'var(--grn)':c.sev==='crit'?'var(--red)':'var(--amb)';
    return`<div class="fi ${c.sev}" style="animation-delay:${i*50}ms">
      <div class="fi-hdr">
        <div><div style="font-size:.72rem;font-weight:700;color:${barCol}">${tip.label}</div>
          <div style="font-size:.55rem;color:var(--sub)">${c.sev==='good'?'On goal':c.sev==='crit'?'Critical':'Needs work'}</div></div>
        <span class="fi-badge ${c.sev}">${c.sev.toUpperCase()}</span></div>
      <div class="fi-vals">
        <div><div class="fi-vl">Current</div><div class="fi-vv" style="color:${barCol}">${c.fmt(c.val)}</div></div>
        <div><div class="fi-vl">Goal</div><div class="fi-vv" style="color:var(--sub)">${c.lo?'≤':'≥'}${c.goal}${c.su}</div></div>
        <div><div class="fi-vl">Gap</div><div class="fi-vv" style="color:${c.ok?'var(--grn)':'var(--amb)'}">${c.ok?'✔ None':c.gap.toFixed(c.su==='d'?2:1)+c.su}</div></div>
      </div>
      <div class="fi-bar"><div class="fi-bar-f" style="width:${barW}%;background:${barCol}"></div></div>
      ${!c.ok?`<div class="fi-tips"><ul>${tip.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
    </div>`;
  }).join('');
}

// ── Filter / sort ─────────────────────────────────────────────
function setRole(r,btn){curRole=r;document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');buildLB();}

// ── Select a technician ───────────────────────────────────────
function selectTech(name){
  selTech=name; selTradeAvg=null;
  buildLB();
  const t=techs().find(x=>x.name===name);
  if(!t)return;
  buildTradeSummary(t.role);
  renderSpotlight(t);
  closeDrawerOnMobile();
}
// On mobile, viewing a tech spotlight or a trade ranking table should always
// close the drawer -- otherwise it sits on top of #right-panel (z-index:800)
// and silently swallows every touch/scroll/click meant for the content underneath.
function closeDrawerOnMobile(){
  if(isMobileLayout()){
    const panel=document.getElementById('left-panel');
    const btn=document.getElementById('collapse-btn');
    const back=document.getElementById('drawer-backdrop');
    panel.classList.remove('open');
    if(back)back.classList.remove('on');
    btn.textContent='\u2630';
    btn.title='Open menu';
    document.getElementById('right-panel').scrollTop=0;
  }
}
function doSearch(q){const ql=q.toLowerCase();document.querySelectorAll('.lb-row').forEach(r=>r.style.display=(!q||r.dataset.name.includes(ql))&&(curRole==='All'||r.dataset.role===curRole)?'':'none');}
function setPeriod(d,btn){
  curDays=d;
  document.querySelectorAll('.pb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  buildKPI();
  if(selTech){
    buildLB();
    const t=techs().find(x=>x.name===selTech);
    if(t){renderSpotlight(t);buildTradeSummary(t.role);}
  }else if(selTradeAvg){
    selectTradeAvg(selTradeAvg); // re-renders the leaderboard AND the trade ranking table for the new period
  }else{
    buildLB();
  }
}

// ── Boot ──────────────────────────────────────────────────────
// ── Sidebar toggle ───────────────────────────────────────────────
function toggleSidebar(){
  const panel=document.getElementById('left-panel');
  const btn  =document.getElementById('collapse-btn');
  const back =document.getElementById('drawer-backdrop');
  const mobile=isMobileLayout();
  if(mobile){
    // Drawer mode: toggle .open on the panel
    const isOpen=panel.classList.toggle('open');
    back.classList.toggle('on', isOpen);
    btn.textContent=isOpen?'❮':'☰';
    btn.title=isOpen?'Close menu':'Open menu';
  } else {
    // Desktop mode: collapse by width
    const col=panel.classList.toggle('collapsed');
    btn.classList.toggle('open',!col);
    btn.textContent=col?'❯':'❮';
    btn.title=col?'Show list':'Hide list';
  }
}
// On mobile start with drawer closed; on desktop start with panel open
(function(){
  const btn=document.getElementById('collapse-btn');
  if(isMobileLayout()){
    // Mobile: button is FAB showing hamburger. Panel starts hidden (translateX(-105%))
    btn.textContent='☰';
    btn.title='Open menu';
    btn.classList.remove('open');
  } else {
    // Desktop: panel is visible, button slides to left:280px
    btn.textContent='❮';
    btn.title='Hide technicians';
    btn.classList.add('open');
  }
})();

// ── Mobile: auto-hide the header banner while scrolling down, reveal on scroll up ──
(function(){
  const THRESHOLD=8; // px of movement required before toggling, avoids jitter
  let collapsed=false;
  const lastY={right:0,list:0};

  function setCollapsed(state){
    if(collapsed===state)return;
    collapsed=state;
    document.body.classList.toggle('hdr-collapsed',state);
  }

  function onScroll(key){
    return function(e){
      if(!MOBILE_MQ.matches)return;
      const y=e.target.scrollTop;
      const delta=y-lastY[key];
      if(Math.abs(delta)<THRESHOLD)return;
      lastY[key]=y;
      if(y<=4){setCollapsed(false);return;} // always show banner right at the top
      setCollapsed(delta>0); // scrolling down -> hide, scrolling up -> show
    };
  }

  const rightEl=document.getElementById('right-panel');
  const listEl=document.getElementById('lb-list');
  if(rightEl)rightEl.addEventListener('scroll',onScroll('right'),{passive:true});
  if(listEl)listEl.addEventListener('scroll',onScroll('list'),{passive:true});
  MOBILE_MQ.addEventListener('change',e=>{if(!e.matches)setCollapsed(false);});
})();

buildKPI();buildLB();

// ── Subtle tap feedback (vibration + quiet click tick) ──────────
// Fires on every interactive element (buttons, tabs, tech/trade rows)
// via one delegated listener instead of touching each onclick handler.
// Kept deliberately quiet/short so it reads as "acknowledged" not "loud".
(function(){
  let feedbackCtx=null;
  function playTick(){
    try{
      if(!feedbackCtx)feedbackCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(feedbackCtx.state==='suspended')feedbackCtx.resume();
      const ctx=feedbackCtx;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.035,ctx.currentTime+0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime+0.06);
    }catch(e){/* audio not available -- fail silently, vibration still fires */}
  }
  function tapFeedback(){
    if(navigator.vibrate)navigator.vibrate(8); // very short, subtle buzz (mobile only)
    playTick();
  }
  const TAPPABLE='button, [onclick], .lb-row, .lb-trade-row';
  document.addEventListener('click',function(e){
    if(e.target.closest(TAPPABLE))tapFeedback();
  },true);
})();
</script>
